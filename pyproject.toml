[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appmanager-sdk"
dynamic = ["version"]
description = "Lightweight developer SDK and manifest generator for AppManager sub-applications and extensions."
readme = "README.md"
authors = [
    { name = "AppManager Contributors" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "appmanager",
    "flask",
    "wsgi",
    "sub-apps",
    "manifest",
    "microfrontends",
    "sdk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = []

[project.optional-dependencies]
flask = [
    "Flask>=2.0.0,<4.0",
    "Werkzeug>=2.0.0,<4.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "Flask>=3.0.0,<4.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "mypy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/r3sbarra/appmanager-sdk"
Documentation = "https://github.com/r3sbarra/appmanager-sdk#readme"
Repository = "https://github.com/r3sbarra/appmanager-sdk.git"
Issues = "https://github.com/r3sbarra/appmanager-sdk/issues"
Changelog = "https://github.com/r3sbarra/appmanager-sdk/blob/master/CHANGELOG.md"

[project.scripts]
appmanager-sdk = "appmanager_sdk.cli:main"
appmgr-sdk = "appmanager_sdk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "appmanager_sdk.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["appmanager_sdk*"]

[tool.setuptools.package-data]
appmanager_sdk = ["py.typed"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["appmanager_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60

